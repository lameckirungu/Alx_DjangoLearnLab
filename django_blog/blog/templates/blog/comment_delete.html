{% extends "blog/base.html" %}
{% block content %}
<h1>Delete Comment</h1>
<p>Are you sure you want to delete "{{ object.content }}"?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit">Yes, delete</button>
</form>
<a href="{% url 'comment-detail' object.pk %}">Cancel</a>
{% endblock %}
