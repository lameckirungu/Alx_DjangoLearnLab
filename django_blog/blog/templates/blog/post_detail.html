{% extends "blog/base.html" %}
{% block content %}
<article>
  <h1>{{ post.title }}</h1>
  <p>{{ post.content }}</p>
  <small>By {{ post.author.username }} on {{ post.published_date }}</small>
</article>

{% if user == post.author %}
  <a href="{% url 'post-update' post.pk %}">Edit</a>
  <a href="{% url 'post-delete' post.pk %}">Delete</a>
{% endif %}
<a href="{% url 'post-list' %}">Back to posts</a>
{% endblock %}
