{% extends "blog/base.html" %}
{% block content %}
<h1>Search Results</h1>
<p>Query: "{{ query }}"</p>

{% for post in posts %}
  <article>
    <h2><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h2>
    <p>{{ post.content|truncatechars:140 }}</p>
  </article>
{% empty %}
  <p>No results found.</p>
{% endfor %}
{% endblock %}
