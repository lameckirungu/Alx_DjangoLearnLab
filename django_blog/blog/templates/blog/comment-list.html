{% extends "blog/base.html" %}
{% block content %}
<h1>Comments</h1>

{% if user.is_authenticated %}
    <a href="{% url comment-create' %}">New Comment</a>
{% endif %}

{% for comment in comments %}
    <article>
        <p>
            <a href="{% url 'comment-detail' comment.pk %}">{{ comment.content }}</a>
        </p>
        <small>By {{ comment.author.username }} on {{ comment.updated_at }}</small>
    </article>
{% empty %}
    <p>No comments yet.</p>
{% endfor %}
{% endblock %}
